<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HP STORE - Khôi phục mật khẩu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/styles/login.css" />
  </head>
  <body>
    <div
      class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-login-page"
    >
      <div
        class="card p-4 p-md-5 shadow-lg border-0 login-card"
        style="max-width: 450px; width: 100%"
      >
        <div class="text-center mb-4">
          <div
            class="d-flex align-items-center justify-content-center rounded-3 shadow mx-auto mb-3"
            style="
              background-color: #6138ff;
              color: #fff;
              width: 56px;
              height: 56px;
              font-size: 22px;
            "
          >
            <i class="fa-solid fa-key"></i>
          </div>
          <h1 class="h3 fw-bold text-dark mb-1">HP STORE</h1>
          <p class="text-muted small">Khôi phục quyền truy cập tài khoản</p>
        </div>

        <form id="forgotPasswordForm">
          <div class="mb-4">
            <label
              for="email"
              class="form-label text-muted small fw-semibold mb-2"
            >
              Địa chỉ Email đăng ký
            </label>
            <div class="position-relative">
              <i
                class="fa-regular fa-envelope position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary"
              ></i>
              <input
                type="email"
                id="email"
                class="form-control ps-5 py-2-5"
                placeholder="nguyenvan@gmail.com"
              />
            </div>
            <div
              id="emailError"
              class="error-text text-danger small mt-1 d-none"
              style="font-size: 13px"
            ></div>
          </div>

          <button
            type="submit"
            id="btnSubmitEmail"
            class="btn btn-primary w-100 py-3 fw-bold shadow-sm"
            style="background-color: #6138ff; border: none"
          >
            Gửi mã xác nhận <i class="fa-solid fa-paper-plane ms-2"></i>
          </button>
        </form>

        <form id="resetPasswordForm" class="d-none">
          <div class="mb-3">
            <label
              for="otp"
              class="form-label text-muted small fw-semibold mb-2"
            >
              Mã xác thực OTP (6 chữ số)
            </label>
            <div class="position-relative">
              <i
                class="fa-solid fa-shield-halved position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary"
              ></i>
              <input
                type="text"
                id="otp"
                class="form-control ps-5 py-2-5 fw-bold text-center"
                placeholder="X X X X X X"
                maxlength="6"
                style="letter-spacing: 4px"
              />
            </div>
            <div
              id="otpError"
              class="error-text text-danger small mt-1 d-none"
              style="font-size: 13px"
            ></div>
          </div>

          <div class="mb-4">
            <label
              for="newPassword"
              class="form-label text-muted small fw-semibold mb-2"
            >
              Mật khẩu mới
            </label>
            <div class="position-relative">
              <i
                class="fa-solid fa-lock position-absolute start-0 top-50 translate-middle-y ms-3 text-secondary"
              ></i>
              <input
                type="password"
                id="newPassword"
                class="form-control px-5 py-2-5"
                placeholder="Tối thiểu 6 ký tự"
              />
              <button
                type="button"
                class="btn position-absolute end-0 top-50 translate-middle-y border-0 me-2 text-secondary"
                id="toggleNewPassword"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div
              id="newPasswordError"
              class="error-text text-danger small mt-1 d-none"
              style="font-size: 13px"
            ></div>
          </div>

          <button
            type="submit"
            id="btnResetPass"
            class="btn btn-success w-100 py-3 fw-bold shadow-sm"
          >
            Đặt lại mật khẩu <i class="fa-solid fa-check ms-2"></i>
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="mb-0 small">
            <a
              href="/src/pages/login.html"
              class="text-decoration-none fw-semibold"
              style="color: #6138ff"
            >
              <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập
            </a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/JS/forgotPassword.js"></script>
  </body>
</html>
